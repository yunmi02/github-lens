services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/lens
      DATA_DIR: /app/data
    volumes:
      - lens-data:/app/data
      - ocr-models:/home/lens/.paddlex
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lens
      POSTGRES_DB: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  lens-data:
  postgres-data:
  ocr-models:
